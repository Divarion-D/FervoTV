# Signed release: push a tag "v<versionName>" (e.g. v0.2.0) -> tests, lint, signed APK, GitHub Release.
# Manual run (Actions -> Release -> Run workflow) builds the same APK as an artifact without publishing a release.
#
# Repository secrets:
#   FERVO_KEYSTORE_BASE64   base64 of the .jks file
#   FERVO_KEYSTORE_PASSWORD, FERVO_KEY_ALIAS, FERVO_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Tag matches versionName
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Version must use major.minor.patch: $v"; exit 1; }
          grep -q "versionName = \"$v\"" build.gradle.kts || {
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName in build.gradle.kts"; exit 1; }

      - name: Keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.FERVO_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Secret FERVO_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FERVO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests, lint and signed APK
        env:
          FERVO_KEYSTORE_PASSWORD: ${{ secrets.FERVO_KEYSTORE_PASSWORD }}
          FERVO_KEY_ALIAS: ${{ secrets.FERVO_KEY_ALIAS }}
          FERVO_KEY_PASSWORD: ${{ secrets.FERVO_KEY_PASSWORD }}
        # Tests and lint of all modules; app-tv (runs on TV and phones) is the public package.
        run: ./gradlew testReleaseUnitTest lintRelease :app-tv:assembleRelease --stacktrace

      - name: Collect files
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          mkdir dist
          cp app-tv/build/outputs/apk/release/app-tv-release.apk "dist/FervoTV-$v.apk"
          # Refuse to ship an unsigned APK (e.g. a secret is missing). Runners have several build-tools: take the newest.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "dist/FervoTV-$v.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: FervoTV-${{ env.VERSION }}
          path: dist/

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes = this version's section of the in-app changelog ("## 0.2.0 — date").
          awk -v v="$VERSION" '/^## /{p = index($0, "## " v " ") == 1; next} p' core/src/main/assets/CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Fervo TV $VERSION" --notes-file notes.md
