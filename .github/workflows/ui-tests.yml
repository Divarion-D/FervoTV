name: Device UI tests

on:
  push:
    branches: [main]
    paths:
      - app-tv/**
      - core/**
      - .github/workflows/ui-tests.yml
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - gradle.properties
      - gradlew
  pull_request:
    paths:
      - app-tv/**
      - core/**
      - .github/workflows/ui-tests.yml
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - gradle.properties
      - gradlew
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Phone API 35
            api: 35
            target: google_apis
            arch: x86_64
            profile: pixel_2
            mode: phone
          - name: Android TV API 35
            api: 35
            target: android-tv
            arch: x86_64
            profile: tv_1080p
            mode: tv

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: ANDROID_SERIAL=emulator-5554 make test-ui-device TEST_ARGS="-Pandroid.testInstrumentationRunnerArguments.expectedMode=${{ matrix.mode }} -Pandroid.testInstrumentationRunnerArguments.class=app.iptvplayer.NavigationUiTest#navigatesWithTheDeviceInputMode"

      - name: UI test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests-${{ matrix.target }}-api-${{ matrix.api }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app-tv/build/outputs/androidTest-results/connected/
            app-tv/build/reports/androidTests/connected/
