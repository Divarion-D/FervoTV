# Every commit (any branch) and pull request: unit tests, lint, debug build.
name: CI

on:
  push:
    branches: ["**"] # tags are handled by release.yml
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FervoTV-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
