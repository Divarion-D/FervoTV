# Every commit (any branch) and pull request: unit tests, lint, debug build.
name: CI

on:
  push:
    branches: ["**"] # tags are handled by release.yml
  pull_request:
  workflow_dispatch: # manual run from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v6

      # All modules: core tests, lint of core/app-tv/app-mobile, both debug APKs.
      - name: Unit tests, lint, debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/

      - name: Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: FervoTV-debug-${{ github.sha }}
          path: |
            app-tv/build/outputs/apk/debug/app-tv-debug.apk
            app-mobile/build/outputs/apk/debug/app-mobile-debug.apk
          retention-days: 14
